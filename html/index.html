<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xTeVe Reborn</title>
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="img/favicon-192.png">
    <link rel="apple-touch-icon" href="img/favicon-180.png">
    <link rel="stylesheet" href="css/screen.css" type="text/css">
    <link rel="stylesheet" href="css/base.css" type="text/css">

    <script language="javascript" type="text/javascript" src="js/network_ts.js"></script>
    <script language="javascript" type="text/javascript" src="js/menu_ts.js"></script>
    <script language="javascript" type="text/javascript" src="js/settings_ts.js"></script>
    <script language="javascript" type="text/javascript" src="js/logs_ts.js"></script>
    <script language="javascript" type="text/javascript" src="js/base_ts.js"></script>

  </head>

    <body onload="javascript: PageReady();">

      <div id="loading" class="none">
        <div class="loader"></div>
      </div>

      <div id="popup" class="none">
        <div id="popup-custom"></div>
      </div>

      <div id="layout">

        <!--
        <div id="notification">
          <div class="element">
            <h5>XEPG</h5>
            <pre>11.05.2019 - 20:21</pre>
            <hr>
            <p>Hallo das ist ein Test. Und noch mehr Text.</p>
          </div>
        </div>
      -->

        <div id="menu-wrapper" class="layout-left">
          <div id= "branch"></div>
          <div id="logo"></div>
          <nav id="main-menu"></nav>
        </div>

        <div class="layout-right">

          <div id="clientInfo" class="stat-bar">

            <div class="stat">
              <span class="stat-label">Version</span>
              <span class="stat-value" id="version">&nbsp;</span>
            </div>
            <div class="stat">
              <span class="stat-label">Streams</span>
              <span class="stat-value" id="streams">&nbsp;</span>
            </div>
            <div class="stat">
              <span class="stat-label">EPG Source</span>
              <span class="stat-value" id="epgSource">&nbsp;</span>
            </div>
            <div class="stat">
              <span class="stat-label">XEPG Channels</span>
              <span class="stat-value" id="xepg">&nbsp;</span>
            </div>
            <div class="stat">
              <span class="stat-label">Errors</span>
              <span class="stat-value stat-errors" id="errors">&nbsp;</span>
            </div>
            <div class="stat">
              <span class="stat-label">Warnings</span>
              <span class="stat-value stat-warnings" id="warnings">&nbsp;</span>
            </div>
            <div class="stat stat-tech">
              <span class="stat-label">System</span>
              <span class="stat-value"><span id="os">&nbsp;</span> / <span id="arch">&nbsp;</span></span>
            </div>
            <div class="stat stat-tech">
              <span class="stat-label">DVR IP</span>
              <span class="stat-value" id="DVR">&nbsp;</span>
            </div>
            <div class="stat stat-tech stat-uuid">
              <span class="stat-label">UUID</span>
              <span class="stat-value" id="uuid">&nbsp;</span>
            </div>

          </div>

          <div id="clientInfoUrls" class="stat-urls">
            <div class="stat-url-row">
              <span class="stat-label">M3U URL</span>
              <span class="stat-value" id="m3u-url">&nbsp;</span>
            </div>
            <div class="stat-url-row">
              <span class="stat-label">XEPG URL</span>
              <span class="stat-value" id="xepg-url">&nbsp;</span>
            </div>
          </div>

          <div id="myStreamsBox" class="notVisible">

            <div id="allStreams">
              <table id="activeStreams"></table>
              <table id="inactiveStreams"></table>
            </div>

          </div>
          
          <div id="content" class=""></div>
            
        </div>

      </div>
      
    </body>
    
</html>
