name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine version for -ldflags
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi

      # Every run builds and actually starts the image, not just builds it:
      # checks the entrypoint drops to the non-root PUID, the app serves
      # the HDHomeRun endpoints, and it can write its config.
      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: xteve-reborn:smoke
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/config"
          docker run -d --name smoke -p 34400:34400 -v "$RUNNER_TEMP/config:/config" xteve-reborn:smoke

          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:34400/discover.json > /dev/null 2>&1 && break
            sleep 1
          done

          docker logs smoke
          curl -fsS http://127.0.0.1:34400/discover.json | grep -q '"DeviceID"'
          curl -fsS http://127.0.0.1:34400/lineup_status.json | grep -q '"ScanInProgress"'
          curl -fsS -o /dev/null http://127.0.0.1:34400/web/

          uid="$(docker exec smoke stat -c %u /proc/1)"
          echo "app runs as uid $uid"
          test "$uid" = "1000"
          test "$(docker exec smoke stat -c %u /config/settings.json)" = "1000"

      # Only log in and push on an actual release tag - PRs and ordinary
      # pushes to main just build and smoke-test, without publishing a
      # "latest" image for every commit.
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image tags
        id: tags
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          IMAGE="${IMAGE,,}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tags=${IMAGE}:${TAG},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:ci-build" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push multi-arch (release tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
