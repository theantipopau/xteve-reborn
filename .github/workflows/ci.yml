name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        run: go test -race ./...

      - name: verify embedded web-asset bundle is up to date
        run: |
          go run ./tools/verify-embedded-assets
          if ! git diff --exit-code src/webUI.go; then
            echo "src/webUI.go is stale: rebuild it (run xteve with -dev, or go run ./tools/verify-embedded-assets) and commit the result."
            exit 1
          fi

      # html/js/*_ts.js is compiled from ts/*.ts. A change made to only one
      # side once shipped features the sources didn't have (found in 3.0.5),
      # so a later compile would have dropped them. Pinned compiler version:
      # another version can format the output differently.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: verify compiled JS matches ts/
        run: |
          cd ts
          npx --yes -p typescript@5.6.3 tsc *.ts --outDir ../html/js/
          cd ..
          if ! git diff --exit-code html/js; then
            echo "html/js is out of date with ts/: run 'cd ts && npx -p typescript@5.6.3 tsc *.ts --outDir ../html/js/', then 'go run ./tools/verify-embedded-assets', and commit both."
            exit 1
          fi
